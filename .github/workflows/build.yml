name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build simplhttp
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: cd ui && npm ci

      - name: Build UI
        run: cd ui && npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build Go binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME=simplhttp
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=simplhttp.exe
          fi
          go build -ldflags="-s -w" -trimpath -o $BINARY_NAME main.go
          
          # Create artifact directory
          mkdir -p dist
          mv $BINARY_NAME dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simplhttp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          mkdir release
          cd artifacts
          for dir in */; do
            platform=$(basename "$dir")
            # Copy raw binary to release folder with platform name
            if [[ "$platform" == *"windows"* ]]; then
              cp "$dir/simplhttp.exe" "../release/simplhttp-${platform}.exe"
            else
              cp "$dir/simplhttp" "../release/simplhttp-${platform}"
            fi
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
